name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Compile sources
        run: python -m compileall -q src tests

      - name: Build wheel and sdist
        run: python -m build

      - name: Create isolated wheel environment
        run: python -m venv wheel-venv

      - name: Validate wheel on Linux
        if: runner.os == 'Linux'
        run: |
          wheel-venv/bin/python -m pip install dist/*.whl
          wheel-venv/bin/python -m hermes_ops --help

      - name: Validate wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl).FullName
          .\wheel-venv\Scripts\python.exe -m pip install $wheel
          .\wheel-venv\Scripts\python.exe -m hermes_ops --help

